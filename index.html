<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cálculo de exceso de cómputo</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
    }

    h1 {
        color: #005a9c;
    }

    .grupo {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
    }

    button {
        padding: 10px 20px;
        cursor: pointer;
        background-color: #005a9c;
        color: white;
        border: none;
        border-radius: 4px;
    }

    #resultado {
        margin-top: 25px;
        padding: 15px;
        background-color: #f2f2f2;
        border-radius: 4px;
        font-size: 1.1em;
    }
</style>
</head>
<body>

<h1>Cálculo de exceso de cómputo</h1>

<div class="grupo">
    <label for="anio">Año</label>
    <input type="number" id="anio" min="1900" max="3000" value="2027">
</div>

<div class="grupo">
    <label for="festivos">
        Número de festivos que caen de lunes a viernes
    </label>
    <input type="number" id="festivos" min="0" value="14">
</div>

<button onclick="calcular()">Calcular</button>

<div id="resultado"></div>

<script>
function calcular() {

    const anio = parseInt(document.getElementById("anio").value);
    const festivos = parseInt(document.getElementById("festivos").value);

    let diasLaborables = 0;

    const fecha = new Date(anio, 0, 1);

    while (fecha.getFullYear() === anio) {

        const diaSemana = fecha.getDay();

        // 1=Lunes ... 5=Viernes
        if (diaSemana >= 1 && diaSemana <= 5) {
            diasLaborables++;
        }

        fecha.setDate(fecha.getDate() + 1);
    }

    const diasTrabajados = diasLaborables - festivos;
    const excesoComputo = diasTrabajados - 247;

    document.getElementById("resultado").innerHTML = `
        <p><strong>Días laborables (lunes a viernes):</strong> ${diasLaborables}</p>
        <p><strong>Festivos introducidos:</strong> ${festivos}</p>
        <p><strong>Días efectivos de trabajo:</strong> ${diasTrabajados}</p>
        <hr>
        <p><strong>Al año ${anio} le corresponden ${excesoComputo} días de exceso de cómputo.</strong></p>
    `;
}
</script>

</body>
</html>
